name: Job Studio CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    name: Python and MCP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  frontend:
    name: React build and browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - name: Check that the committed bundle matches the React source
        run: git diff --exit-code --stat -- job_studio/static/studio.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m tests_browser
      - name: Run synthetic MCP workload
        run: python -m benchmarks.m0

